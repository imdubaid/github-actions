name: Manual Trigger with Params

on:
    workspace_dispatch:
        inputs:
            name:
                description: 'Name of the person to greet'
                required: true
                type: string
            greeting:
                description: 'Type of greeting'
                required: true
                type: choice
                options:
                    - Hello
                    - Hi
                    - Hey

jobs:
    greet:
        runs-on: ubuntu-latest

        steps:
            - name: Greet the person
              run: echo "${{ github.event.inputs.greeting }}, ${{ github.event.inputs.name }}!"
